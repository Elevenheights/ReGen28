<section class="stats-grid" aria-label="Tracker statistics" [attr.aria-busy]="isLoading">
  <div><span>This week</span><strong *ngIf="!isLoading">{{ stats?.weeklyCount || 0 }}</strong><ion-skeleton-text *ngIf="isLoading" animated></ion-skeleton-text><small>entries</small></div>
  <div><span>Current streak</span><strong *ngIf="!isLoading">{{ stats?.currentStreak || 0 }}</strong><ion-skeleton-text *ngIf="isLoading" animated></ion-skeleton-text><small>days</small></div>
  <div><span>Total sessions</span><strong *ngIf="!isLoading">{{ stats?.totalSessions || 0 }}</strong><ion-skeleton-text *ngIf="isLoading" animated></ion-skeleton-text><small>logged</small></div>
  <div><span>Best streak</span><strong *ngIf="!isLoading">{{ stats?.longestStreak || 0 }}</strong><ion-skeleton-text *ngIf="isLoading" animated></ion-skeleton-text><small>days</small></div>
</section>
