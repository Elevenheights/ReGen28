<header class="editorial-header">
  <div class="brand-row">
    <span class="wordmark">Regen <em>28</em></span>
    <div class="header-actions">
      <button
        *ngIf="actionIcon"
        type="button"
        (click)="onActionClick()"
        [attr.aria-label]="'Add or log ' + title"
      >
        <i [class]="'fa-solid ' + actionIcon" aria-hidden="true"></i>
      </button>
      <button
        *ngIf="historyIcon"
        type="button"
        (click)="historyClick.emit()"
        aria-label="View history"
      >
        <i [class]="'fa-solid ' + historyIcon" aria-hidden="true"></i>
      </button>
      <img
        *ngIf="showProfile && profileUrl"
        class="profile"
        [src]="profileUrl"
        [alt]="userName + ' profile picture'"
      />
    </div>
  </div>
  <p *ngIf="subtitle" class="eyebrow">{{ subtitle }}</p>
  <h1>{{ title }}</h1>
  <div class="header-projection"><ng-content></ng-content></div>
</header>
