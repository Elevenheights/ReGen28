<article
  class="tracker-editorial"
  [class.compact]="compactMode"
  [class.is-complete]="tracker.todayCompleted"
>
  <div class="tracker-topline">
    <span class="category-label"
      ><i [class]="'fa-solid ' + trackerIcon" aria-hidden="true"></i>
      {{ categoryShortLabel }}</span
    ><span class="completion-badge" *ngIf="tracker.todayCompleted"
      >✓ Logged today</span
    ><span
      *ngIf="!tracker.todayCompleted && durationDisplay"
      class="duration-label"
      >{{ durationDisplay }}</span
    >
  </div>
  <button
    class="tracker-title"
    type="button"
    (click)="onCardClick()"
    [attr.aria-label]="'View ' + tracker.name"
  >
    <h3>{{ tracker.name || "Tracker" }}</h3>
    <span aria-hidden="true">↗</span>
  </button>
  <div class="tracker-target" *ngIf="tracker.type !== 'boolean'">
    <strong>{{ tracker.target }}</strong
    ><span
      >{{ tracker.unit }}<br /><small
        >per {{ frequencyLabel | lowercase }}</small
      ></span
    >
  </div>
  <p *ngIf="tracker.type === 'boolean'" class="boolean-target">
    One small commitment.<br /><em>Make it yours.</em>
  </p>
  <div class="tracker-meta">
    <span *ngIf="hasStreak">{{ streakDisplay }}</span
    ><span>{{ tracker.totalEntries || 0 }} entries</span
    ><span *ngIf="tracker.todayCompleted && durationDisplay">{{
      durationDisplay
    }}</span>
  </div>
  <div class="tracker-actions" *ngIf="showActions">
    <div class="restored-progress"><span>Progress</span><strong>{{ tracker.progress || 0 }}%</strong><div role="progressbar" [attr.aria-label]="tracker.name + ' progress'" [attr.aria-valuenow]="tracker.progress || 0" aria-valuemin="0" aria-valuemax="100"><span [style.width.%]="tracker.progress || 0"></span></div></div>
    <button
      *ngIf="!tracker.todayCompleted && tracker.type === 'boolean'"
      type="button"
      class="log-button"
      (click)="onQuickLog($event)"
      [attr.aria-label]="'Mark ' + tracker.name + ' complete'"
    >
      Mark complete <span aria-hidden="true">✓</span>
    </button>
    <button
      *ngIf="!tracker.todayCompleted && tracker.type !== 'boolean'"
      type="button"
      class="log-button"
      (click)="onOpenLogModal($event)"
      [attr.aria-label]="'Log entry for ' + tracker.name"
    >
      Log entry <span aria-hidden="true">＋</span>
    </button>
    <button
      *ngIf="tracker.todayCompleted"
      type="button"
      class="details-button"
      (click)="onCardClick()"
    >
      View your progress <span aria-hidden="true">→</span>
    </button>
  </div>
</article>
