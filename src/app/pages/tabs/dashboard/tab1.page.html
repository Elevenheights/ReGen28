<ion-content class="bg-neutral-50">
	<app-page-header [title]="'Your Feed'" [subtitle]="'Daily Inspiration'" theme="indigo" [showProfile]="true"
		[profileUrl]="(profileImageUrl$ | async) || ''" [userName]="(userDisplayName$ | async) || ''">
	</app-page-header>

	<!-- Feed Notice -->
	<div *ngIf="showFeedNotice" class="px-4 pt-4 animate-entry">
		<div
			class="bg-gradient-to-br from-indigo-500/10 to-purple-600/10 border border-indigo-200/50 rounded-3xl p-5 flex items-start gap-4">
			<div class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center shrink-0 shadow-lg">
				<i class="fa-solid fa-user-shield text-white text-lg"></i>
			</div>
			<div class="flex-1 min-w-0">
				<h3 class="text-sm font-bold text-neutral-900 mb-1">Your Personalized Sanctuary</h3>
				<p class="text-xs text-neutral-600 leading-relaxed font-medium">
					This is your own private space. Every post and insight here is crafted specifically for you, based
					on your journey and data. Optional AI features process selected data with AI providers when you give permission.
				</p>
			</div>
			<button type="button" (click)="dismissFeedNotice()" aria-label="Dismiss personalized sanctuary notice"
				class="shrink-0 w-9 h-9 rounded-full text-neutral-600 hover:bg-indigo-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-indigo-600">
				<i class="fa-solid fa-xmark" aria-hidden="true"></i>
			</button>
		</div>
	</div>

	<!-- Today's Guidance Section -->
	<div *ngIf="todaysGuidance$ | async as guidance" class="px-4 pt-4 pb-2">
		<ng-container *ngIf="guidance.actions.length > 0 || guidance.insights.length > 0">
			<h2 class="text-lg font-bold mb-3 ml-1 text-neutral-800 flex items-center gap-2">
				<ion-icon name="sparkles" class="text-indigo-500"></ion-icon>
				Today's Guidance
			</h2>

			<!-- Actions -->
			<div *ngFor="let item of guidance.actions" class="mb-4 animate-fade-in-up">
				<app-feed-item-card [item]="item"></app-feed-item-card>
			</div>

			<!-- Insights -->
			<div *ngFor="let item of guidance.insights" class="mb-4 animate-fade-in-up"
				[style.animation-delay]="'100ms'">
				<app-feed-item-card [item]="item"></app-feed-item-card>
			</div>
		</ng-container>
	</div>

	<div class="feed-wrapper">
		<app-feed-list [excludedItemIds]="(todaysGuidance$ | async)?.ids || []"></app-feed-list>
	</div>
</ion-content>
