<ion-content class="muse-content"
  ><main class="history-page">
    <header class="history-toolbar">
      <ion-buttons
        ><ion-back-button
          defaultHref="/tabs/tracker"
          text=""
          aria-label="Back to trackers"
        ></ion-back-button></ion-buttons
      ><span>Regen <em>28</em></span>
    </header>
    <p class="kicker">Your past chapters</p>
    <h1>Progress to<br /><em>look back on.</em></h1>
    <div class="history-switch">
      <button
        type="button"
        [attr.aria-pressed]="viewMode === 'archived'"
        (click)="viewMode = 'archived'"
      >
        Archived</button
      ><button
        type="button"
        [attr.aria-pressed]="viewMode === 'completed'"
        (click)="viewMode = 'completed'"
      >
        Completed
      </button>
    </div>
    <ng-container *ngIf="viewMode === 'archived'"
      ><ng-container *ngIf="archivedTrackers$ | async as trackers"
        ><button
          *ngFor="let tracker of trackers"
          class="past-tracker"
          type="button"
          (click)="navigateToTrackerDetail(tracker)"
        >
          <span
            ><small>{{ getCategoryLabel(tracker.category) }} · Archived</small
            ><strong>{{ tracker.name }}</strong
            ><small *ngIf="tracker.archivedAt"
              >{{ tracker.archivedAt | date:'mediumDate' }}</small
            ></span
          ><span aria-hidden="true">↗</span>
        </button>
        <p class="empty-history" *ngIf="!trackers.length">
          No archived trackers. Trackers you archive will be kept here.
        </p></ng-container
      ></ng-container
    >
    <ng-container *ngIf="viewMode === 'completed'"
      ><ng-container *ngIf="completedTrackers$ | async as trackers"
        ><button
          *ngFor="let tracker of trackers"
          class="past-tracker"
          type="button"
          (click)="navigateToTrackerDetail(tracker)"
        >
          <span
            ><small>{{ getCategoryLabel(tracker.category) }} · Completed</small
            ><strong>{{ tracker.name }}</strong
            ><small *ngIf="tracker.endDate"
              >{{ tracker.endDate | date:'mediumDate' }}</small
            ></span
          ><span class="completed-check" aria-hidden="true">✓</span>
        </button>
        <p class="empty-history" *ngIf="!trackers.length">
          Your completed trackers will appear here. Keep going at your own pace.
        </p></ng-container
      ></ng-container
    >
  </main></ion-content
>
