<ion-content class="muse-content intro-content"
  ><main class="intro-layout">
    <header class="intro-header">
      <span class="wordmark">Regen <em>28</em></span
      ><button type="button" (click)="goToLogin()">Sign in ↗</button>
    </header>
    <section
      class="intro-slide"
      (touchstart)="onTouchStart($event)"
      (touchend)="onTouchEnd($event)"
      aria-live="polite"
    >
      <div class="intro-image">
        <img [src]="featureSlides[currentSlide].image" alt="" /><span
          class="image-label"
          >YOUR PACE. YOUR PROGRESS.</span
        >
      </div>
      <div class="intro-copy">
        <p class="kicker">{{ featureSlides[currentSlide].subtitle }}</p>
        <h1>{{ featureSlides[currentSlide].title }}</h1>
        <p>{{ featureSlides[currentSlide].description }}</p>
      </div>
    </section>
    <nav class="intro-navigation" aria-label="Introduction slides">
      <div class="intro-dots">
        <button
          *ngFor="let slide of featureSlides; let i = index"
          type="button"
          [class.active]="i === currentSlide"
          (click)="goToSlide(i)"
          [attr.aria-label]="'Go to slide ' + (i + 1)"
          [attr.aria-current]="i === currentSlide ? 'step' : null"
        >
          <span></span>
        </button>
      </div>
      <button
        type="button"
        *ngIf="!isFirstSlide()"
        class="previous"
        (click)="prevSlide()"
        aria-label="Previous slide"
      >
        ←</button
      ><button
        type="button"
        class="next"
        (click)="isLastSlide() ? goToRegister() : nextSlide()"
      >
        {{ isLastSlide() ? 'Get started' : 'Next' }}
        <span aria-hidden="true">→</span>
      </button>
    </nav>
  </main></ion-content
>
